<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>测测你的灵魂与哪位作家相似？</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
  /* ===== 设计变量：莫兰迪浅色系 ===== */
  :root{
    --bg:#F6F3EC;            /* 奶油底色 */
    --card:#FFFFFF;
    --ink:#3E3C36;           /* 主文字（暖黑） */
    --ink-soft:#7C796E;      /* 次级文字 */
    --ink-faint:#A9A69A;     /* 弱文字 */
    --line:#EAE5DA;          /* 分隔线 */
    --accent:#8FA48D;        /* 鼠尾草绿（主强调） */
    --accent-deep:#70846F;
    --accent-soft:#E9EFE3;
    --rose:#C9AFA6;          /* 雾霾粉（点缀） */
    --rose-soft:#F3EAE4;
    --blue:#B9C9CE;          /* 浅灰蓝（点缀） */
    --blue-soft:#E7EDEE;
    --sand:#E3D9C2;          /* 沙色（点缀） */
    --sand-soft:#F2EDDE;
    --radius:18px;
    --shadow:0 10px 30px rgba(120,110,90,.10);
    --serif:'Noto Serif SC', Georgia, 'Songti SC', 'SimSun', serif;
    --sans:'Noto Sans SC', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -200px, #ECE7DB 0%, rgba(236,231,219,0) 60%),
      var(--bg);
    min-height:100vh;
    line-height:1.7;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  img{display:block;max-width:100%;}

  /* ===== 顶部标题栏 ===== */
  .topbar{
    position:sticky;top:0;z-index:20;
    height:48px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(246,243,236,.88);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(234,229,218,.7);
  }
  .topbar .mini-title{
    font-family:var(--serif);font-size:14px;font-weight:600;
    letter-spacing:.5px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:86vw;
  }
  .topbar.hidden{display:none;}

  /* ===== 页面容器 ===== */
  .wrap{
    max-width:520px;margin:0 auto;
    padding:0 20px 48px;
  }
  .view{display:none;}
  .view.active{display:block;}

  /* ===== 通用卡片与按钮 ===== */
  .card{
    background:var(--card);border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid rgba(234,229,218,.6);
  }
  .btn-primary{
    width:100%;height:52px;border-radius:999px;
    background:var(--accent);color:#fff;
    font-size:16px;font-weight:700;letter-spacing:1px;
    box-shadow:0 6px 18px rgba(143,164,141,.35);
    transition:background .2s, transform .1s, opacity .2s;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-primary:active{transform:scale(.985);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
  .btn-ghost{
    width:100%;height:52px;border-radius:999px;
    background:transparent;color:var(--ink-soft);
    font-size:15px;font-weight:500;
    border:1px solid var(--line);
    transition:background .2s;
  }
  .btn-ghost:active{background:rgba(234,229,218,.4);}

  /* ===== 封面 ===== */
  .cover-hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:40px;}
  .cover-hero .hero-img{
    width:min(280px,72vw);border-radius:22px;
    box-shadow:0 14px 34px rgba(120,110,90,.16);
  }
  .cover-hero h1{
    font-family:var(--serif);font-size:27px;font-weight:700;
    line-height:1.45;margin-top:30px;letter-spacing:.5px;
  }
  .cover-hero .intro{
    margin-top:16px;color:var(--ink-soft);font-size:15px;
    max-width:320px;text-wrap:pretty;
  }
  .cover-hero .intro b{color:var(--accent-deep);font-weight:700;}
  .cover-cta{margin-top:34px;width:100%;max-width:340px;}
  .cover-meta{
    margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
  }
  .cover-meta .chip{
    font-size:12px;color:var(--ink-soft);
    background:rgba(255,255,255,.7);border:1px solid var(--line);
    border-radius:999px;padding:5px 12px;
  }

  /* ===== 答题页 ===== */
  .quiz-progress{margin-top:20px;}
  .quiz-progress .row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:13px;color:var(--ink-soft);
  }
  .quiz-progress .row .q-no{font-family:var(--serif);font-weight:600;color:var(--ink);}
  .progress-track{
    margin-top:8px;height:6px;border-radius:999px;
    background:rgba(234,229,218,.9);overflow:hidden;
  }
  .progress-bar{
    height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--rose));
    transition:width .35s ease;
  }
  .question-card{margin-top:18px;padding:26px 22px 22px;}
  .question-text{
    font-family:var(--serif);font-size:18.5px;font-weight:600;
    line-height:1.6;text-wrap:pretty;
  }
  .options{display:flex;flex-direction:column;gap:12px;margin-top:22px;}
  .opt{
    display:flex;align-items:center;gap:14px;text-align:left;
    width:100%;padding:14px 16px;border-radius:16px;
    border:1.5px solid var(--line);background:var(--card);
    font-size:15px;color:var(--ink);line-height:1.55;
    transition:border-color .18s, background .18s, transform .1s;
  }
  .opt:active{transform:scale(.99);}
  .opt .letter{
    flex:none;width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:var(--ink-soft);
    background:var(--sand-soft);transition:all .18s;
  }
  .opt:hover{border-color:var(--blue);}
  .opt.selected{
    border-color:var(--accent);background:var(--accent-soft);
  }
  .opt.selected .letter{background:var(--accent);color:#fff;}
  .opt.selected::after{
    content:"";flex:none;width:18px;height:18px;margin-left:auto;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, #fff 0 3px, transparent 3.5px),
      var(--accent);
  }
  .quiz-nav{
    display:flex;align-items:center;gap:14px;margin-top:26px;
  }
  .quiz-nav .prev{
    flex:none;width:auto;padding:0 8px;height:52px;
    font-size:14.5px;color:var(--ink-soft);
  }
  .quiz-nav .prev:disabled{visibility:hidden;}
  .quiz-nav .next{flex:1;}
  .quiz-tip{margin-top:16px;text-align:center;font-size:12px;color:var(--ink-faint);}

  /* ===== 结果页 ===== */
  .result-head{text-align:center;padding-top:30px;}
  .result-head .eyebrow{
    font-size:13px;letter-spacing:3px;color:var(--ink-soft);
  }
  .result-card{margin-top:18px;padding:30px 24px 26px;text-align:center;}
  .result-card .w-name{
    font-family:var(--serif);font-size:34px;font-weight:700;line-height:1.3;
  }
  .result-card .w-meta{
    margin-top:8px;font-size:13px;color:var(--ink-soft);
  }
  .match{margin-top:22px;}
  .match .match-num{
    font-family:var(--serif);font-size:40px;font-weight:700;
    color:var(--accent-deep);
  }
  .match .match-label{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .match-track{
    margin:12px auto 0;width:220px;max-width:80%;height:7px;
    border-radius:999px;background:rgba(234,229,218,.9);overflow:hidden;
  }
  .match-bar{
    height:100%;border-radius:999px;
    background:linear-gradient(90deg,var(--accent),var(--rose));
    transition:width .8s ease;
  }
  .tag-row{
    margin-top:20px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
  }
  .tag{
    font-size:12.5px;padding:6px 13px;border-radius:999px;
    background:var(--rose-soft);color:#8A6A60;
    border:1px solid rgba(201,175,166,.4);
  }
  .tag.sage{background:var(--accent-soft);color:var(--accent-deep);border-color:rgba(143,164,141,.4);}
  .tag.blue{background:var(--blue-soft);color:#5E7B84;border-color:rgba(185,201,206,.5);}
  .w-body{margin-top:26px;text-align:left;}
  .w-block{padding:16px 0;border-top:1px dashed var(--line);}
  .w-block:first-child{border-top:none;padding-top:0;}
  .w-block h4{
    font-size:13px;letter-spacing:2px;color:var(--accent-deep);
    margin-bottom:7px;font-weight:700;
  }
  .w-block p{font-size:14.5px;color:var(--ink);text-wrap:pretty;}
  .quote-box{
    margin-top:24px;padding:20px 20px;border-radius:16px;
    background:var(--rose-soft);border:1px solid rgba(201,175,166,.35);
    text-align:center;
  }
  .quote-box .q-label{font-size:12px;letter-spacing:2px;color:#9A7A70;}
  .quote-box .q-text{
    font-family:var(--serif);font-size:16px;font-weight:600;
    color:#6E554D;margin-top:8px;line-height:1.7;
  }
  .dims{margin-top:24px;text-align:left;}
  .dims h4{font-size:13px;letter-spacing:2px;color:var(--ink-soft);margin-bottom:12px;font-weight:700;}
  .dim-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
  .dim-row .dim-name{flex:none;width:64px;font-size:13px;color:var(--ink);}
  .dim-row .dim-track{flex:1;height:6px;border-radius:999px;background:rgba(234,229,218,.9);overflow:hidden;}
  .dim-row .dim-bar{height:100%;border-radius:999px;background:var(--blue);transition:width .6s ease;}
  .dim-row .dim-val{flex:none;width:30px;text-align:right;font-size:12px;color:var(--ink-soft);}
  .result-brand{
    margin-top:26px;text-align:center;
    font-family:var(--serif);font-size:13.5px;color:var(--ink-soft);
    letter-spacing:.5px;
  }
  .result-actions{margin-top:22px;display:flex;flex-direction:column;gap:12px;}
  .result-note{
    margin-top:18px;text-align:center;font-size:12px;color:var(--ink-faint);
  }

  /* 动效克制：仅轻量渐入 */
  .view.active{animation:fadeUp .3s ease both;}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:none;}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important;}
  }
  @media (max-width:380px){
    .cover-hero h1{font-size:24px;}
    .question-text{font-size:17.5px;}
  }
</style>
</head>
<body>

<header class="topbar hidden" id="topbar">
  <div class="mini-title">测测你的灵魂与哪位作家相似？</div>
</header>

<main class="wrap">

  <!-- ===== 视图：封面 ===== -->
  <section class="view active" id="view-cover">
    <div class="cover-hero">
      <img class="hero-img" src="https://aka.doubaocdn.com/s/UpFLx7yJdX" alt="摊开的书与羽毛笔插画">
      <h1>测测你的灵魂<br>与哪位作家相似？</h1>
      <p class="intro">
        20 道关于生活、审美与选择的小问题，没有标准答案，<b>选最像你的那个就好</b>。
        测完看看，你的灵魂深处，藏着哪位作家的影子。
      </p>
      <div class="cover-cta">
        <button class="btn-primary" id="btn-start">开始测试</button>
      </div>
      <div class="cover-meta">
        <span class="chip">20 道题</span>
        <span class="chip">约 3 分钟</span>
        <span class="chip">30 位作家候场</span>
      </div>
    </div>
  </section>

  <!-- ===== 视图：答题 ===== -->
  <section class="view" id="view-quiz">
    <div class="quiz-progress">
      <div class="row">
        <span class="q-no" id="q-no">第 1 / 20 题</span>
        <span id="q-pct">0%</span>
      </div>
      <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
    </div>
    <div class="card question-card">
      <p class="question-text" id="q-text"></p>
      <div class="options" id="q-opts"></div>
    </div>
    <div class="quiz-nav">
      <button class="prev" id="btn-prev">上一题</button>
      <button class="btn-primary next" id="btn-next" disabled>下一题</button>
    </div>
    <p class="quiz-tip">选完当前这题，才能进入下一题哦</p>
  </section>

  <!-- ===== 视图：结果 ===== -->
  <section class="view" id="view-result">
    <div class="result-head">
      <div class="eyebrow">你的文学灵魂是</div>
    </div>
    <div class="card result-card" id="result-card"></div>
    <div class="result-actions">
      <button class="btn-primary" id="btn-retry">重新测试</button>
      <button class="btn-ghost" id="btn-home">返回封面</button>
    </div>
    <p class="result-note">结果仅供娱乐，别太当真，你比任何标签都丰富。</p>
  </section>

</main>

<script>
/* ===== 数据 ===== */

// 八种灵魂气质
const DIMS = {
  A:'理想主义', B:'锐利深刻', C:'温柔治愈', D:'浪漫诗意',
  E:'理性思辨', F:'自由不羁', G:'敏感内省', H:'超然通透'
};

// 20 道题，每题 4 个选项；p=主气质(+2)，s=辅气质(+1)
const QUESTIONS = [
  { q:'如果有一整天空闲，你会怎么过？', opts:[
    {t:'重看一部经典电影，为某个理想主义的瞬间热泪盈眶', p:'A', s:'D'},
    {t:'做一顿好饭，把房间收拾得干干净净', p:'C', s:'A'},
    {t:'研究一个感兴趣的话题，认真做点笔记', p:'E', s:'B'},
    {t:'一个人发呆，回想最近的人和事', p:'G', s:'C'}
  ]},
  { q:'朋友跟你吐槽一件糟心事，你的第一反应是？', opts:[
    {t:'一针见血点出问题根源，朋友直呼「太狠了但好准」', p:'B', s:'E'},
    {t:'陪TA聊到深夜，把情绪写成小诗发给TA', p:'D', s:'C'},
    {t:'直接拉TA出去吃顿好的，明天再说', p:'F', s:'B'},
    {t:'认真听完，说一句「都会过去的，别太较真」', p:'H', s:'E'}
  ]},
  { q:'你更欣赏哪种类型的人？', opts:[
    {t:'温暖善良、总替别人着想的人', p:'C', s:'A'},
    {t:'逻辑清晰、不情绪化的人', p:'E', s:'B'},
    {t:'情感细腻、懂得欣赏生活的人', p:'G', s:'D'},
    {t:'有信念、坚持做自己认为对的事的人', p:'A', s:'C'}
  ]},
  { q:'面对一段结束的关系，你通常会？', opts:[
    {t:'写很多文字，把情绪都释放出来', p:'D', s:'F'},
    {t:'立刻去学新东西、去旅行，重新出发', p:'F', s:'D'},
    {t:'难过，但很快想通：缘分如此', p:'H', s:'E'},
    {t:'冷静复盘，看清问题出在哪里', p:'B', s:'G'}
  ]},
  { q:'旅行时你更喜欢？', opts:[
    {t:'做好攻略，行程安排得明明白白', p:'E', s:'C'},
    {t:'去安静的地方，慢慢感受氛围', p:'G', s:'D'},
    {t:'去有历史意义的地方，看理想与现实的痕迹', p:'A', s:'E'},
    {t:'吃当地美食，和当地人聊聊天', p:'C', s:'D'}
  ]},
  { q:'你觉得自己最像下面哪种动物？', opts:[
    {t:'猫：自由、优雅，只按自己的节奏', p:'F', s:'A'},
    {t:'鹤：安静、超然，不与凡鸟争', p:'H', s:'F'},
    {t:'鹰：目光犀利，看透一切', p:'B', s:'E'},
    {t:'夜莺：为美歌唱，哪怕无人听见', p:'D', s:'A'}
  ]},
  { q:'你理想中的生活是？', opts:[
    {t:'内心丰盈，一个人也能把日子过出滋味', p:'G', s:'H'},
    {t:'做有意义的事，让世界好一点点', p:'A', s:'D'},
    {t:'有爱的人和温暖的家，三餐四季', p:'C', s:'A'},
    {t:'按计划一步步实现目标，掌控人生', p:'E', s:'B'}
  ]},
  { q:'读到一本很喜欢的书，你会？', opts:[
    {t:'合上书，安静地回味很久，不急于分享', p:'H', s:'G'},
    {t:'快速抓住作者的核心观点，点评一针见血', p:'B', s:'E'},
    {t:'摘抄喜欢的句子，配图发朋友圈', p:'D', s:'A'},
    {t:'想立刻找到同好，聊到停不下来', p:'F', s:'D'}
  ]},
  { q:'你面对「规则」的态度是？', opts:[
    {t:'遵守规则，但坚持内心认为对的事', p:'A', s:'F'},
    {t:'温和地遵守，也照顾别人的感受', p:'C', s:'E'},
    {t:'先理解规则背后的逻辑，再决定怎么对待', p:'E', s:'B'},
    {t:'会感到束缚，需要很多独处时间消化', p:'G', s:'F'}
  ]},
  { q:'你更容易被什么打动？', opts:[
    {t:'一个人不动声色的清醒和坚持', p:'B', s:'C'},
    {t:'夕阳、海浪、陌生人一句温柔的问候', p:'D', s:'A'},
    {t:'荒唐但勇敢的冒险', p:'F', s:'A'},
    {t:'时间带来的释然与和解', p:'H', s:'G'}
  ]},
  { q:'如果有机会写一本书，你会写？', opts:[
    {t:'一个治愈人心、温暖落地的故事', p:'C', s:'D'},
    {t:'一部冷静剖析人性的作品', p:'E', s:'B'},
    {t:'自己半真半假的成长记录', p:'G', s:'D'},
    {t:'关于理想和信念的内心独白', p:'A', s:'H'}
  ]},
  { q:'你在群体中通常是？', opts:[
    {t:'氛围担当：有我在就不会冷场', p:'D', s:'C'},
    {t:'自由派：说来就来说走就走', p:'F', s:'G'},
    {t:'旁观者：微笑看大家闹', p:'H', s:'F'},
    {t:'吐槽担当：一句话说到点子上', p:'B', s:'E'}
  ]},
  { q:'你对「爱情」的理解更接近？', opts:[
    {t:'是理解与并肩，是清醒的选择', p:'E', s:'B'},
    {t:'是深刻的心动，也是长久的自省', p:'G', s:'D'},
    {t:'是救赎，让人成为更好的人', p:'A', s:'D'},
    {t:'是陪伴，是一起吃饭一起变老', p:'C', s:'A'}
  ]},
  { q:'面对困境，你最先做的是？', opts:[
    {t:'先逃离现场，喘口气再说', p:'F', s:'E'},
    {t:'想开点，天塌下来当被盖', p:'H', s:'F'},
    {t:'直面问题，找到最锋利的那把刀', p:'B', s:'E'},
    {t:'把情绪表达出来，哭一场、写一段', p:'D', s:'A'}
  ]},
  { q:'你理想中的「美」更接近？', opts:[
    {t:'孤独的、有故事感的、有点破碎的', p:'G', s:'B'},
    {t:'干净纯粹的、闪着理想光的', p:'A', s:'D'},
    {t:'质朴日常的、有烟火气的', p:'C', s:'D'},
    {t:'克制的、有结构的、耐看的', p:'E', s:'B'}
  ]},
  { q:'你更愿意被评价为？', opts:[
    {t:'通透', p:'H', s:'C'},
    {t:'清醒', p:'B', s:'G'},
    {t:'浪漫', p:'D', s:'C'},
    {t:'有趣', p:'F', s:'C'}
  ]},

  if(saved && Array.isArray(saved.answers) && saved.answers.length === QUESTIONS.length){
    answers = saved.answers;
    cur = Math.min(saved.cur || 0, QUESTIONS.length - 1);
  }
}catch(e){}

function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({answers, cur})); }catch(e){}
}

/* ===== 路由 ===== */
const views = {
  cover: document.getElementById('view-cover'),
  quiz: document.getElementById('view-quiz'),
  result: document.getElementById('view-result')
};
const topbar = document.getElementById('topbar');

function showView(name){
  Object.keys(views).forEach(k => views[k].classList.toggle('active', k === name));
  topbar.classList.toggle('hidden', name === 'cover');
  window.scrollTo(0, 0);
}

function route(){
  const h = location.hash;
  if(h === '#quiz'){ showView('quiz'); renderQuestion(); }
  else if(h === '#result'){
    if(answers.every(a => a !== null)){ showView('result'); renderResult(); }
    else{ location.hash = '#cover'; }
  }
  else{ showView('cover'); }
}

/* ===== 答题渲染 ===== */
const qText = document.getElementById('q-text');
const qOpts = document.getElementById('q-opts');
const qNo = document.getElementById('q-no');
const qPct = document.getElementById('q-pct');
const bar = document.getElementById('progress-bar');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');

function renderQuestion(){
  const item = QUESTIONS[cur];
  qText.textContent = item.q;
  qNo.textContent = `第 ${cur + 1} / 20 题`;
  qPct.textContent = Math.round(cur / 20 * 100) + '%';
  bar.style.width = (cur / 20 * 100) + '%';
  btnPrev.disabled = (cur === 0);
  btnNext.disabled = (answers[cur] === null);
  btnNext.textContent = (cur === QUESTIONS.length - 1) ? '查看结果' : '下一题';

  qOpts.innerHTML = '';
  item.opts.forEach((opt, idx) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (answers[cur] === idx ? ' selected' : '');
    b.innerHTML = '<span class="letter">' + LETTERS[idx] + '</span><span>' + opt.t + '</span>';
    b.addEventListener('click', () => {
      answers[cur] = idx;
      save();
      qOpts.querySelectorAll('.opt').forEach((el, i) => el.classList.toggle('selected', i === idx));
      btnNext.disabled = false;
    });
    qOpts.appendChild(b);
  });
}

btnPrev.addEventListener('click', () => { if(cur > 0){ cur--; renderQuestion(); window.scrollTo(0, 0); } });
btnNext.addEventListener('click', () => {
  if(answers[cur] === null) return;
  if(cur < QUESTIONS.length - 1){ cur++; save(); renderQuestion(); window.scrollTo(0, 0); }
  else{ save(); location.hash = '#result'; }
});

/* ===== 结果计算与渲染 ===== */
function computeResult(){
  const s = {A:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0};
  QUESTIONS.forEach((item, i) => {
    const o = item.opts[answers[i]];
    s[o.p] += 2;
    s[o.s] += 1;
  });
  const order = ['A','B','C','D','E','F','G','H'];
  const ranked = order.slice().sort((x, y) => s[y] - s[x] || order.indexOf(x) - order.indexOf(y));
  let writer = WRITERS[0], best = -1;
  WRITERS.forEach(w => {
    const sc = s[w.pair[0]] * 2 + s[w.pair[1]];
    if(sc > best){ best = sc; writer = w; }
  });
  const pct = Math.max(72, Math.min(96, Math.round(best / 30 * 100)));
  return { writer, pct, ranked, s };
}

function renderResult(){
  const { writer, pct, ranked, s } = computeResult();
  const card = document.getElementById('result-card');
  const topTwo = ranked.slice(0, 2).map(k => DIMS[k]);

  const dimsHtml = ranked.slice(0, 3).map(k => {
    const w = Math.max(8, Math.round(s[k] / 30 * 100));
    return '<div class="dim-row"><span class="dim-name">' + DIMS[k] + '</span>' +
           '<span class="dim-track"><span class="dim-bar" style="width:' + w + '%"></span></span>' +
           '<span class="dim-val">' + s[k] + '</span></div>';
  }).join('');

  card.innerHTML =
    '<div class="w-name">' + writer.name + '</div>' +
    '<div class="w-meta">' + writer.era + ' · ' + (writer.origin === '国内' ? '国内作家' : '国外作家') + '</div>' +
    '<div class="match"><div class="match-num">' + pct + '%</div>' +
    '<div class="match-label">灵魂契合度</div>' +
    '<div class="match-track"><div class="match-bar" style="width:' + pct + '%"></div></div></div>' +
    '<div class="tag-row">' +
      '<span class="tag sage">' + topTwo[0] + '</span>' +
      '<span class="tag blue">' + topTwo[1] + '</span>' +
      writer.tags.map((t, i) => '<span class="tag' + (i === 0 ? ' rose' : '') + '">' + t + '</span>').join('') +
    '</div>' +
    '<div class="w-body">' +
      '<div class="w-block"><h4>精神特征</h4><p>' + writer.spirit + '</p></div>' +
      '<div class="w-block"><h4>性格底色</h4><p>' + writer.base + '</p></div>' +
      '<div class="w-block"><h4>小缺点</h4><p>' + writer.flaw + '</p></div>' +
    '</div>' +
    '<div class="quote-box"><div class="q-label">TA 想对你说</div>' +
    '<div class="q-text">「' + writer.line + '」</div></div>' +
    '<div class="dims"><h4>你的灵魂气质构成</h4>' + dimsHtml + '</div>' +
    '<div class="result-brand">—— 测测你的灵魂与哪位作家相似？ ——</div>';
}

/* ===== 按钮 ===== */
document.getElementById('btn-start').addEventListener('click', () => { location.hash = '#quiz'; });
document.getElementById('btn-retry').addEventListener('click', () => {
  answers = Array(QUESTIONS.length).fill(null);
  cur = 0;
  save();
  location.hash = '#cover';
});
document.getElementById('btn-home').addEventListener('click', () => { location.hash = '#cover'; });

window.addEventListener('hashchange', route);
route();
</script>
</body>
